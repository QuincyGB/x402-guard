[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x402-guard"
version = "0.1.0"
description = "Payment-path seatbelt for x402 buyer agents: Settled pre-flight, endpoint drift checks (StallRow Recheck), RouteVerdict trust gates, and spend caps enforced before any payment is signed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Quincy Goertz-Brown" },
]
keywords = ["x402", "agents", "payments", "usdc", "base", "guard", "middleware", "verdict-row"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27",
    "eth-account>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/QuincyGB/x402-guard"
Repository = "https://github.com/QuincyGB/x402-guard"
Issues = "https://github.com/QuincyGB/x402-guard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/x402_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
